<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>廢氣拉力賽 Fume Rally</title>
    <meta name="theme-color" content="#08141d" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2308141d'/%3E%3Crect x='4' y='13' width='24' height='9' rx='2' fill='%2337c6ff'/%3E%3Crect x='10' y='8' width='11' height='7' rx='1.5' fill='%2337c6ff'/%3E%3Ccircle cx='10' cy='23' r='3' fill='%23dcebf2'/%3E%3Ccircle cx='22' cy='23' r='3' fill='%23dcebf2'/%3E%3C/svg%3E"
    />
    <meta name="description" content="A retro maze-rally arcade game built with Three.js." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="hud">
      <h1 class="brand">
        <span class="brand-zh" data-i18n="app.title"></span>
        <span class="brand-en" data-i18n="app.subtitle"></span>
      </h1>
      <dl class="stats">
        <div class="stat">
          <dt data-i18n="hud.score"></dt>
          <dd id="score">000000</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.hi"></dt>
          <dd id="hi">000000</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.level"></dt>
          <dd id="level">1</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.combo"></dt>
          <dd id="combo">×1</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.lives"></dt>
          <dd id="lives" class="lives"></dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.gems"></dt>
          <dd id="gemsLeft">0</dd>
        </div>
        <div class="stat" id="armorStat" hidden>
          <dt id="armorLabel"></dt>
          <dd id="armorEl">●</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.power"></dt>
          <dd id="power">—</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.time"></dt>
          <dd><span id="timeEl">0:00.0</span><span id="ghostDelta" class="delta"></span></dd>
        </div>
      </dl>
      <div class="fuel">
        <span class="fuel-label" data-i18n="hud.fuel"></span>
        <div
          class="fuel-track"
          id="fuelTrack"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="100"
          data-i18n-label="hud.fuel"
        >
          <div class="fuel-fill" id="fuelFill"></div>
        </div>
      </div>
    </header>
    <div class="debug" id="debug" hidden>
      <span>DEV</span>
      <label>Level <input id="devLevel" type="number" min="1" max="99" value="1" /></label>
      <label
        >Cars unlocked through stage <input id="devCarLv" type="number" min="0" max="40" placeholder="0"
      /></label>
    </div>
    <div class="play scroll" id="play">
      <main class="stage" id="stage" tabindex="0" data-i18n-label="app.canvasLabel">
        <canvas id="gl" role="img" data-i18n-label="app.canvasLabel"></canvas>
        <div class="banner" id="banner" role="status" aria-live="polite" hidden></div>
        <div class="touch" id="touch">
          <div class="dpad">
            <button type="button" class="pad up" data-dir="up" data-i18n-label="dir.up">
              <svg viewBox="0 0 24 24"><path d="M12 5l9 13H3z" fill="currentColor" /></svg>
            </button>
            <button type="button" class="pad left" data-dir="left" data-i18n-label="dir.left">
              <svg viewBox="0 0 24 24"><path d="M12 5l9 13H3z" fill="currentColor" /></svg>
            </button>
            <button type="button" class="pad right" data-dir="right" data-i18n-label="dir.right">
              <svg viewBox="0 0 24 24"><path d="M12 5l9 13H3z" fill="currentColor" /></svg>
            </button>
            <button type="button" class="pad down" data-dir="down" data-i18n-label="dir.down">
              <svg viewBox="0 0 24 24"><path d="M12 5l9 13H3z" fill="currentColor" /></svg>
            </button>
          </div>
          <button type="button" class="smoke" id="btnSmoke" data-smoke data-i18n="btn.smoke"></button>
        </div>
        <div class="achtoast" id="achToast" role="status" aria-live="polite" hidden></div>
        <div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
      </main>
      <div class="side">
        <aside class="radar" data-i18n-label="radar.title">
          <p class="radar-title">RADAR</p>
          <canvas id="radar"></canvas>
          <p class="runinfo" id="runInfo"></p>
          <ul class="radar-key">
            <li><i style="background: #37c6ff"></i><span data-i18n="radar.you"></span></li>
            <li><i style="background: #ff5b4b"></i><span data-i18n="radar.chaser"></span></li>
            <li><i style="background: #ffc83d"></i><span data-i18n="radar.gem"></span></li>
            <li><i style="background: #b8b0a2"></i><span data-i18n="radar.rock"></span></li>
          </ul>
        </aside>
        <section class="menu-panel" id="challenge" data-i18n-label="challenge.title">
          <div class="tabs" id="sideTabs" role="tablist" data-i18n-label="tabs.label">
            <button
              type="button"
              role="tab"
              id="tab-car"
              data-tab="car"
              aria-controls="pane-car"
              data-i18n="tab.car"
            ></button>
            <button
              type="button"
              role="tab"
              id="tab-challenge"
              data-tab="challenge"
              aria-controls="pane-challenge"
              data-i18n="tab.challenge"
            ></button>
            <button
              type="button"
              role="tab"
              id="tab-board"
              data-tab="board"
              aria-controls="pane-board"
              data-i18n="tab.board"
            ></button>
          </div>
          <div class="tabpane garage" id="pane-car" role="tabpanel" aria-labelledby="tab-car">
            <div class="cars" id="cars" role="group"></div>
            <p class="hint" id="carHint"></p>
          </div>
          <div class="tabpane" id="pane-challenge" role="tabpanel" aria-labelledby="tab-challenge">
            <div class="seg" role="group">
              <button type="button" class="seg-btn" data-mode="normal" aria-pressed="true"></button>
              <button type="button" class="seg-btn" data-mode="daily" aria-pressed="false"></button>
              <button type="button" class="seg-btn" data-mode="custom" aria-pressed="false"></button>
            </div>
            <div class="codebox">
              <label for="codeInput" data-i18n="code.label"></label>
              <div class="coderow">
                <input
                  id="codeInput"
                  type="text"
                  maxlength="12"
                  autocomplete="off"
                  autocapitalize="characters"
                  spellcheck="false"
                />
                <button type="button" id="btnRand"></button>
              </div>
              <p class="hint" id="codeHint"></p>
            </div>
            <label class="check"
              ><input type="checkbox" id="ghostToggle" checked /><span data-i18n="ghost.toggle"></span
            ></label>
          </div>
          <div class="tabpane" id="pane-board" role="tabpanel" aria-labelledby="tab-board">
            <div class="board" id="board"></div>
          </div>
          <button type="button" class="start-btn" id="btnStartChal"></button>
        </section>
      </div>
    </div>
    <footer class="foot">
      <p class="keys">
        <span>
          <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
          <span data-i18n="keys.or"></span>
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          <span data-i18n="keys.drive"></span>
        </span>
        <span><kbd data-i18n="keys.space"></kbd> <span data-i18n="keys.smoke"></span></span>
        <span><kbd>P</kbd> <span data-i18n="keys.pause"></span></span>
        <span><kbd>V</kbd> <span data-i18n="keys.view"></span></span>
        <span><kbd>M</kbd> <span data-i18n="keys.mute"></span></span>
      </p>
      <div class="tools">
        <button type="button" id="btnAch"></button>
        <button type="button" id="btnView"></button>
        <button type="button" id="btnPause"></button>
        <button type="button" id="btnMute" aria-pressed="false"></button>
        <button type="button" id="btnAbout"></button>
        <button type="button" id="btnLang"></button>
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
