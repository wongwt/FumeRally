<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>廢氣拉力賽 Fume Rally</title>
    <meta name="description" content="A retro maze-rally arcade game built with Three.js." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="hud">
      <h1 class="brand">
        <span class="brand-zh" data-i18n="app.title"></span>
        <span class="brand-en" data-i18n="app.subtitle"></span>
      </h1>
      <dl class="stats">
        <div class="stat">
          <dt data-i18n="hud.score"></dt>
          <dd id="score">000000</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.hi"></dt>
          <dd id="hi">000000</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.level"></dt>
          <dd id="level">1</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.combo"></dt>
          <dd id="combo">×1</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.lives"></dt>
          <dd id="lives" class="lives"></dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.gems"></dt>
          <dd id="gemsLeft">0</dd>
        </div>
        <div class="stat">
          <dt data-i18n="hud.time"></dt>
          <dd id="timeEl">0:00.0</dd>
        </div>
      </dl>
      <div class="fuel">
        <span class="fuel-label" data-i18n="hud.fuel"></span>
        <div class="fuel-track" id="fuelTrack"><div class="fuel-fill" id="fuelFill"></div></div>
      </div>
    </header>
    <div class="debug" id="debug" hidden>
      <span>DEV</span>
      <label>Level <input id="level" type="number" min="1" max="99" value="1" /></label>
      <label>Code <input id="code" type="text" maxlength="12" placeholder="RALLY7" /></label>
    </div>
    <main class="stage" id="stage" tabindex="0">
      <canvas id="gl" aria-label="Game"></canvas>
      <div class="banner" id="banner" hidden></div>
    </main>
    <footer class="foot">
      <p class="keys">
        <span>
          <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
          <span data-i18n="keys.or"></span>
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          <span data-i18n="keys.drive"></span>
        </span>
        <span><kbd>P</kbd> <span data-i18n="keys.pause"></span></span>
        <span><kbd>V</kbd> <span data-i18n="keys.view"></span></span>
      </p>
      <div class="tools">
        <button type="button" id="btnView"></button>
        <button type="button" id="btnPause"></button>
        <button type="button" id="btnLang"></button>
      </div>
      <div class="touch" id="touch">
        <div class="dpad">
          <button type="button" class="pad up" data-dir="up" aria-label="Up">
            <svg viewBox="0 0 24 24"><path d="M12 5l9 13H3z" fill="currentColor" /></svg>
          </button>
          <button type="button" class="pad left" data-dir="left" aria-label="Left">
            <svg viewBox="0 0 24 24"><path d="M12 5l9 13H3z" fill="currentColor" /></svg>
          </button>
          <button type="button" class="pad right" data-dir="right" aria-label="Right">
            <svg viewBox="0 0 24 24"><path d="M12 5l9 13H3z" fill="currentColor" /></svg>
          </button>
          <button type="button" class="pad down" data-dir="down" aria-label="Down">
            <svg viewBox="0 0 24 24"><path d="M12 5l9 13H3z" fill="currentColor" /></svg>
          </button>
        </div>
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
