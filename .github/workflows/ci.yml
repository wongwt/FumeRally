name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Licence notices are embedded in the single file
        run: grep -q 'three.js authors' dist/index.html && grep -q 'SIL OPEN FONT LICENSE' dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: fume-rally-single-file
          path: dist/index.html
